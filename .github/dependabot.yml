version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "04:15"
      timezone: UTC
    open-pull-requests-limit: 5
    groups:
      kotlin-build-tooling:
        patterns:
          - "org.jetbrains.kotlin*"
          - "com.android.*"
          - "com.google.devtools.ksp*"
      androidx:
        patterns:
          - "androidx.*"
      server-runtime:
        patterns:
          - "org.postgresql*"
          - "com.zaxxer*"
          - "com.squareup.okhttp3*"
          - "org.jetbrains.kotlinx*"
    labels:
      - dependencies
    commit-message:
      prefix: deps

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "04:30"
      timezone: UTC
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - ci
    commit-message:
      prefix: ci

  - package-ecosystem: docker
    directory: /deploy
    schedule:
      interval: weekly
      day: monday
      time: "04:45"
      timezone: UTC
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - container
    commit-message:
      prefix: container
