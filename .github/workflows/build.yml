name: Build JARVIS APK

permissions:
  contents: read

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    services:
      postgres:
        # PostgreSQL 17.10 Bookworm — immutable multi-arch manifest digest.
        image: postgres:17.10-bookworm@sha256:9b18b78397054fce88a9552e9d5a3ad5bb7fd258c5b3cc1c5028e46373d6ea8f
        env:
          POSTGRES_DB: jarvis_test
          POSTGRES_USER: jarvis_test
          POSTGRES_PASSWORD: jarvis_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jarvis_test -d jarvis_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      JARVIS_TEST_DATABASE_URL: jdbc:postgresql://127.0.0.1:5432/jarvis_test
      JARVIS_TEST_DATABASE_USER: jarvis_test
      JARVIS_TEST_DATABASE_PASSWORD: jarvis_test_password

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
        with:
          gradle-version: '8.7'
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Verify dependency locks and checksums
        shell: bash
        run: |
          bash ./gradlew :app:dependencies :server:dependencies --write-locks --no-daemon
          git diff --exit-code -- '**/gradle.lockfile' 'gradle/verification-metadata.xml'

      - name: Test Android dev and verify JVM coverage
        shell: bash
        run: |
          bash ./gradlew :app:jacocoDevDebugCoverageVerification \
            --stacktrace --no-daemon --no-parallel --max-workers=2

      - name: Run Android and server static analysis
        shell: bash
        run: |
          bash ./gradlew phase3StaticAnalysis \
            --stacktrace --no-daemon --no-parallel --max-workers=2

      - name: Lint Android dev
        shell: bash
        run: |
          bash ./gradlew :app:lintDevDebug \
            --stacktrace --no-daemon --no-parallel --max-workers=2

      - name: Build Android dev app and instrumentation APKs
        shell: bash
        run: |
          bash ./gradlew :app:assembleDevDebug :app:assembleDevDebugAndroidTest \
            --stacktrace --no-daemon --no-parallel --max-workers=2

      - name: JARVIS benchmark regression
        shell: bash
        run: |
          bash ./gradlew :app:testDevDebugUnitTest --tests '*BenchmarkRegressionTest*' \
            --stacktrace --no-daemon

      - name: Test JARVIS API server
        shell: bash
        run: |
          bash ./gradlew :server:test :server:jacocoTestCoverageVerification \
            :server:build --stacktrace --no-daemon

      - name: Upload test quality reports
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-quality-reports
          path: |
            app/build/reports/jacoco/devDebug/
            app/build/reports/tests/testDevDebugUnitTest/
            app/build/reports/lint-results-devDebug.*
            app/build/reports/detekt/
            server/build/reports/jacoco/test/
            server/build/reports/tests/test/
            server/build/reports/detekt/
          if-no-files-found: warn
          retention-days: 30

      - name: Validate production TLS and topology
        shell: bash
        run: |
          bash ./deploy/verify-production-config.sh
          docker build --file deploy/server.Dockerfile --tag jarvis-server:ci .

      - name: Upload JARVIS APK artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: JARVIS-v0.2-dev.apk
          path: app/build/outputs/apk/dev/debug/*.apk
          if-no-files-found: error
          retention-days: 14

  android-instrumentation:
    name: Android API 34 instrumentation and coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
        with:
          gradle-version: '8.7'
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Enable KVM access
        shell: bash
        run: |
          set -euo pipefail
          test -c /dev/kvm
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run API 34 instrumentation suite and Android coverage
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_2
          cores: 2
          ram-size: 2048M
          disk-size: 4G
          emulator-boot-timeout: 600
          emulator-options: >-
            -no-window -gpu swiftshader_indirect -no-snapshot
            -noaudio -no-boot-anim
          disable-animations: true
          script: bash ./scripts/run-ci-android-coverage.sh

      - name: Upload instrumentation evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: android-api34-instrumentation
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            app/build/reports/coverage/
            ${{ runner.temp }}/instrumentation-gradle.log
          if-no-files-found: warn
          retention-days: 30
