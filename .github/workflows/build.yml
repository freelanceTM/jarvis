name: Build JARVIS APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Find Project and Build APK
        run: |
          PROJECT_DIR=$(find . -type f \( -name "settings.gradle.kts" -o -name "settings.gradle" \) -exec dirname {} \; | head -n 1)
          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Could not find settings.gradle.kts"
            ls -la
            exit 1
          fi
          echo "Building in: $PROJECT_DIR"
          cd "$PROJECT_DIR"
          # Пункт аудита #12: lint в CI — warningsAsErrors + baseline блокируют НОВЫЕ warnings.
          gradle testDebugUnitTest lint assembleDebug --stacktrace

      - name: JARVIS Benchmark regression (Этап 4)
        run: |
          PROJECT_DIR=$(find . -type f \( -name "settings.gradle.kts" -o -name "settings.gradle" \) -exec dirname {} \; | head -n 1)
          cd "$PROJECT_DIR"
          # Защёлка маршрутизации: падение accuracy ниже baseline ломает сборку.
          gradle :app:testDebugUnitTest --tests '*BenchmarkRegressionTest*' --stacktrace

      - name: Test JARVIS API server (Этап 3)
        run: |
          PROJECT_DIR=$(find . -type f \( -name "settings.gradle.kts" -o -name "settings.gradle" \) -exec dirname {} \; | head -n 1)
          cd "$PROJECT_DIR"
          # :server — отдельный JVM-модуль; Android-сборка от него не зависит.
          gradle :server:test :server:build --stacktrace

      - name: Upload JARVIS APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-v0.2.apk
          path: |
            **/build/outputs/apk/debug/*.apk
            **/*.apk
          if-no-files-found: error
