name: Build JARVIS APK

permissions:
  contents: read

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    services:
      postgres:
        # PostgreSQL 17.10 Bookworm — immutable multi-arch manifest digest.
        image: postgres:17.10-bookworm@sha256:9b18b78397054fce88a9552e9d5a3ad5bb7fd258c5b3cc1c5028e46373d6ea8f
        env:
          POSTGRES_DB: jarvis_test
          POSTGRES_USER: jarvis_test
          POSTGRES_PASSWORD: jarvis_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jarvis_test -d jarvis_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      JARVIS_TEST_DATABASE_URL: jdbc:postgresql://127.0.0.1:5432/jarvis_test
      JARVIS_TEST_DATABASE_USER: jarvis_test
      JARVIS_TEST_DATABASE_PASSWORD: jarvis_test_password

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
        with:
          gradle-version: '8.7'
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Verify dependency locks and checksums
        shell: bash
        run: |
          bash ./gradlew :app:dependencies :server:dependencies --write-locks --no-daemon
          git diff --exit-code -- '**/gradle.lockfile' 'gradle/verification-metadata.xml'

      - name: Test, cover, lint and build Android dev
        shell: bash
        run: |
          bash ./gradlew :app:jacocoDevDebugCoverageVerification :app:lintDevDebug \
            :app:assembleDevDebug :app:assembleDevDebugAndroidTest \
            phase3StaticAnalysis --stacktrace --no-daemon

      - name: JARVIS benchmark regression
        shell: bash
        run: |
          bash ./gradlew :app:testDevDebugUnitTest --tests '*BenchmarkRegressionTest*' \
            --stacktrace --no-daemon

      - name: Test JARVIS API server
        shell: bash
        run: |
          bash ./gradlew :server:test :server:jacocoTestCoverageVerification \
            :server:build --stacktrace --no-daemon

      - name: Upload test quality reports
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-quality-reports
          path: |
            app/build/reports/jacoco/devDebug/
            app/build/reports/tests/testDevDebugUnitTest/
            app/build/reports/lint-results-devDebug.*
            app/build/reports/detekt/
            server/build/reports/jacoco/test/
            server/build/reports/tests/test/
            server/build/reports/detekt/
          if-no-files-found: warn
          retention-days: 30

      - name: Validate production TLS and topology
        shell: bash
        run: |
          bash ./deploy/verify-production-config.sh
          docker build --file deploy/server.Dockerfile --tag jarvis-server:ci .

      - name: Upload JARVIS APK artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: JARVIS-v0.2-dev.apk
          path: app/build/outputs/apk/dev/debug/*.apk
          if-no-files-found: error
          retention-days: 14

  android-instrumentation:
    name: Android API 34 instrumentation and coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
        with:
          gradle-version: '8.7'
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Require hardware virtualization
        shell: bash
        run: |
          set -euo pipefail
          test -c /dev/kvm
          sudo chmod 0666 /dev/kvm

      - name: Install API 34 emulator image
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install \
            'platform-tools' \
            'emulator' \
            'system-images;android-34;google_apis;x86_64'
          printf 'no\n' | avdmanager create avd --force \
            --name jarvis-ci-api34 \
            --package 'system-images;android-34;google_apis;x86_64'

      - name: Boot API 34 emulator
        shell: bash
        run: |
          set -euo pipefail
          nohup emulator @jarvis-ci-api34 \
            -no-window -no-audio -no-boot-anim -no-snapshot \
            -gpu swiftshader_indirect -accel on -cores 2 -memory 2048 \
            >"$RUNNER_TEMP/jarvis-emulator.log" 2>&1 &
          echo "$!" >"$RUNNER_TEMP/jarvis-emulator.pid"
          adb start-server
          timeout 180 adb wait-for-device
          if ! timeout 600 bash -c \
            'until [[ "$(adb shell getprop sys.boot_completed | tr -d "\r")" == "1" ]]; do sleep 5; done'; then
            cat "$RUNNER_TEMP/jarvis-emulator.log"
            adb logcat -d || true
            exit 1
          fi
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0
          adb shell svc power stayon true

      - name: Run ordinary instrumentation suite and Android coverage
        shell: bash
        run: |
          bash ./gradlew :app:createDevDebugCoverageReport \
            --stacktrace --no-daemon

      - name: Capture emulator diagnostics
        if: ${{ always() }}
        shell: bash
        run: |
          adb devices -l >"$RUNNER_TEMP/adb-devices.txt" || true
          adb logcat -d >"$RUNNER_TEMP/device-logcat.txt" || true
          if [[ -f "$RUNNER_TEMP/jarvis-emulator.pid" ]]; then
            kill "$(cat "$RUNNER_TEMP/jarvis-emulator.pid")" || true
          fi

      - name: Upload instrumentation evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: android-api34-instrumentation
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            app/build/reports/coverage/
            ${{ runner.temp }}/jarvis-emulator.log
            ${{ runner.temp }}/adb-devices.txt
            ${{ runner.temp }}/device-logcat.txt
          if-no-files-found: warn
          retention-days: 30
